# Docker Compose file for Vapor
#
# Install Docker on your system to run and test
# your Vapor app in a production-like environment.
#
# Note: This file is intended for testing and does not
# implement best practices for a production deployment.
#
# Learn more: https://docs.docker.com/compose/reference/
#
#   Build images: docker compose build
#      Start app: docker compose up app
# Start database: docker compose up db
# Run migrations: docker compose run migrate
#       Stop all: docker compose down (add -v to wipe db)
#

volumes:
  db_data:

x-shared_environment: &shared_environment
  LOG_LEVEL: ${LOG_LEVEL:-debug}
  DATABASE_HOST: db
  DATABASE_TLS_MODE: disable
  DATABASE_NAME: &db_name vapor_database
  WEBHOOK_KEY_ENCRYPTION_KEY: ${WEBHOOK_KEY_ENCRYPTION_KEY:-}
  WEBHOOK_WORKER_CONCURRENCY: ${WEBHOOK_WORKER_CONCURRENCY:-16}
  WEBHOOK_MAX_IN_FLIGHT_PER_ORGANIZATION: ${WEBHOOK_MAX_IN_FLIGHT_PER_ORGANIZATION:-8}
  WEBHOOK_MAX_IN_FLIGHT_PER_SUBSCRIPTION: ${WEBHOOK_MAX_IN_FLIGHT_PER_SUBSCRIPTION:-4}
  WEBHOOK_POLL_INTERVAL_MS: ${WEBHOOK_POLL_INTERVAL_MS:-1000}
  
services:
  app:
    image: open-erp:latest
    build:
      context: .
    environment:
      <<: *shared_environment
      DATABASE_USERNAME: open_erp_runtime
      DATABASE_PASSWORD: open_erp_runtime_local
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-0}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
      OIDC_USERINFO_URL: ${OIDC_USERINFO_URL:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '8080:8080'
    # user: '0' # uncomment to run as root for testing purposes even though Dockerfile defines 'vapor' user.
    command: ["serve", "--env", "production", "--hostname", "0.0.0.0", "--port", "8080"]
  migrate:
    image: open-erp:latest
    build:
      context: .
    environment:
      <<: *shared_environment
      DATABASE_USERNAME: open_erp_owner
      DATABASE_PASSWORD: open_erp_owner_local
    depends_on:
      db:
        condition: service_healthy
    command: ["migrate", "--yes"]
    deploy:
      replicas: 0
  webhook-worker:
    image: open-erp:latest
    build:
      context: .
    init: true
    environment:
      <<: *shared_environment
      DATABASE_USERNAME: open_erp_runtime
      DATABASE_PASSWORD: open_erp_runtime_local
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 30s
    command: ["webhook-worker", "--env", "production"]
  revert:
    image: open-erp:latest
    build:
      context: .
    environment:
      <<: *shared_environment
      DATABASE_USERNAME: open_erp_owner
      DATABASE_PASSWORD: open_erp_owner_local
    depends_on:
      db:
        condition: service_healthy
    command: ["migrate", "--revert", "--yes"]
    deploy:
      replicas: 0
  db:
    image: postgres:18-alpine
    volumes:
      - db_data:/var/lib/postgresql
      - ./Database/bootstrap.sql:/docker-entrypoint-initdb.d/00-bootstrap.sql:ro
      - ./Database/compose-passwords.sql:/docker-entrypoint-initdb.d/01-compose-passwords.sql:ro
    environment:
      POSTGRES_USER: vapor_username
      POSTGRES_PASSWORD: vapor_password
      POSTGRES_DB: *db_name
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "vapor_username", "-d", "vapor_database"]
      interval: 2s
      timeout: 2s
      retries: 20
    ports:
      - '5432:5432'
